# Hex-vision secret scan policy. There are intentionally no broad path or regex
# exclusions: an exception must carry a reason, owner, and expiry in this file.
title = "Hex-vision gitleaks policy"

# The default ruleset is the minimum detection floor. Removing this directive
# silently loads zero rules, so it must remain even when this policy is tidied.
[extend]
useDefault = true

# The repository intentionally carries no committed credential fixtures or
# generated scanner reports. Keep this policy empty until a reviewed,
# attributable false positive exists; a broad path/regex allowlist would hide
# exactly the secret-bearing artefacts the governance harness is meant to find.
# Any future `[[allowlists]]` entry must be limited to an exact path or commit,
# include an owner and expiry comment, and be exercised by a negative test.
