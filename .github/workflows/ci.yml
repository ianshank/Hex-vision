# Hex-vision L3 CI: each gate is ordered by needs and invoked through Makefile targets.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: hex-vision-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@e3f3cf96a6157d90bd3d29b2f7aa51de3ca0d90d # v5.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: make install

  lint:
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@e3f3cf96a6157d90bd3d29b2f7aa51de3ca0d90d # v5.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - run: make install
      - run: make lint

  types:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@e3f3cf96a6157d90bd3d29b2f7aa51de3ca0d90d # v5.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - run: make install
      - run: make types

  cov:
    needs: types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@e3f3cf96a6157d90bd3d29b2f7aa51de3ca0d90d # v5.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - run: make install
      - run: make cov

  secrets:
    needs: cov
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@e3f3cf96a6157d90bd3d29b2f7aa51de3ca0d90d # v5.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - run: make install
      - run: go install github.com/zricethezav/gitleaks/v8@v8.28.0
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make secrets GITLEAKS=gitleaks GITLEAKS_VERSION=v8.28.0

  specs:
    needs: secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@e3f3cf96a6157d90bd3d29b2f7aa51de3ca0d90d # v5.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - run: make install
      - run: make specs

  audit:
    needs: specs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@e3f3cf96a6157d90bd3d29b2f7aa51de3ca0d90d # v5.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - run: make install
      - run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.2.4
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make audit OSV=osv-scanner OSV_VERSION=v2.2.4

  remotes:
    needs: audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@e3f3cf96a6157d90bd3d29b2f7aa51de3ca0d90d # v5.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - run: make install
      - run: make remotes

  projections:
    needs: remotes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@e3f3cf96a6157d90bd3d29b2f7aa51de3ca0d90d # v5.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - run: make install
      - run: make projections

  traceability:
    needs: projections
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@e3f3cf96a6157d90bd3d29b2f7aa51de3ca0d90d # v5.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - run: make install
      - run: make traceability

  conformance:
    needs: traceability
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@e3f3cf96a6157d90bd3d29b2f7aa51de3ca0d90d # v5.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - run: make install
      - run: make conformance PACK=jetson
