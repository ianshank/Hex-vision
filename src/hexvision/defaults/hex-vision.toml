# Hex-vision packaged defaults.
#
# This file is the BASE LAYER of configuration, shipped inside the wheel. It is
# never edited by an adopting repository; a repository overrides it with its own
# `hex-vision.toml`, and only for keys it deliberately owns.
#
# Every value that a robotics team could reasonably need to change lives here or
# in their overlay — nothing operational is embedded in Python source. Keys whose
# `frozen` flag is set in [meta.frozen] refuse environment and CLI overrides,
# because a quality bar an operator can lower from a shell is not a bar.

[meta]
env_prefix = "HEXVISION_"
# Tables whose member names are chosen by the adopter rather than shipped by this
# contract. Members of these tables are accepted without being declared here;
# every other key must be declared, so a typo is rejected instead of ignored.
# robotics.hardware_in_loop.runners is adopter-named because the set of hardware
# rigs is site-specific: an adopter with a rig this project has never heard of
# must be able to declare it without editing the packaged contract.
extensible_tables = [
  "contract.invariants",
  "contract.invariant_enforcement",
  "robotics.hardware_in_loop.runners",
]

[meta.frozen]
# Frozen key prefixes: resolvable from `packaged`, `repo` and `pyproject` only.
# An attempt to set one through the environment or a CLI flag is an error, not a
# silently-honoured override. Coverage floors are frozen for the reason the
# contract states; safety envelopes are frozen because a flight-safety bound
# changed from a shell leaves no reviewable diff.
# `decision_log` is frozen because it is the grammar that decides what counts as a
# recorded human authorization; a shell-supplied grammar could admit prose as
# authority. `scanners` is frozen because it pins the digests that establish a
# scanner's identity, and an overridable digest verifies nothing.
prefixes = [
    "coverage",
    "robotics.safety_envelope",
    "contract",
    "orchestration",
    "decision_log",
    "scanners",
    "specification_validator",
]

# --------------------------------------------------------------------------
# The Gate Harness Contract this repository implements.
# --------------------------------------------------------------------------
[contract]
# Threshold flags in a pack command split quality policy across command lines
# and pyproject. They are blocked so one frozen, reviewable source remains.
forbidden_threshold_flags = ["--cov-fail-under", "--coverage.thresholds", "-Pcoverage.", "--fail-under"]
# The source root is configurable for installed or monorepo layouts while
# retaining the default contract-normalizer discovery behavior.
source_path = "src"
# The 15 target names, identical in every stack pack. A pack that renames one
# has opted out of the shared CI template, conformance suite and audit narrative.
targets = [
  "install", "format", "lint", "types", "test", "cov", "secrets", "specs",
  "audit", "remotes", "projections", "traceability", "guard-probe", "pre-pr",
  "clean",
]
# `pre-pr` must chain these in exactly CI order. If it stops matching CI, a
# local pass stops predicting a CI pass, which is the only reason to run it.
pre_pr_order = [
  "install", "lint", "types", "cov", "secrets", "specs", "audit", "remotes",
  "projections", "agent-validation", "traceability", "conformance", "domain-gates",
]
# Conformance reads the authoritative prerequisite chain from this repository
# artifact; packs must delegate to it instead of copying the chain themselves.
makefile_path = "Makefile"
# The pack's pre-pr command must use this executable to delegate to the
# configured Makefile target rather than inline a second orchestration chain.
make_executable = "make"
# Gates that must fail when their TOOL is absent, separately from failing when
# their CHECK fails. A security control with a silent degraded mode produces a
# green tick and no protection.
fail_closed_on_missing_tool = ["secrets", "audit", "remotes", "cov", "types", "lint"]
# Gates permitted a loud degraded mode: the absence must be printed on stderr on
# EVERY run so it cannot become the invisible steady state.
degrade_loudly = ["specs"]

# Dynamic entry points are not a release allowlist.  Every pack run by
# `domain-gates` must be named in this frozen, reviewed list; discovered plugins
# outside it are deliberately ignored rather than inheriting release authority.
[orchestration]
active_packs = ["jetson"]

[contract.invariants]
inv_1 = "Secret scan covers working tree AND history, and fails closed."
inv_2 = "Zero skipped tests; a skip is a failure, not a status."
inv_3 = "Exactly one URL normalizer, shared by the guard, the hook and CI."
inv_4 = "Git hooks are installed by a script CI itself runs."
inv_5 = "Gates are invoked only through the Makefile, never raw in CI."

# Each invariant is made auditable by the core gate clause or Makefile target
# that enforces it; domain packs must not pretend to own repository-wide controls.
[contract.invariant_enforcement]
inv_1 = "secrets"
inv_2 = "INV-2"
inv_3 = "remotes"
inv_4 = "install"
inv_5 = "INV-5"

# Invariant mappings are claims until a dynamically discovered verifier proves
# them against a negative probe. The no-op list is a backstop; each verifier's
# synthetic violation is the primary evidence that a declared mechanism works.
[contract.conformance]
no_op_commands = ["true", ":", "/bin/true", "echo"]
# Verifiers expose structured evidence. These patterns inspect fields in that
# evidence (or findings returned by core gates), never an implementation's
# human-oriented stdout message.
reason_patterns = { inv_1 = "RuleID", inv_2 = "skip or xfail", inv_3 = "unapproved destination", inv_4 = "\"executable\": true", inv_5 = "forbidden raw command" }
secret_policy_path = ".gitleaks.toml"
# The conformance probe asks the governed `make secrets` target to write this
# temporary report, then validates records rather than scanner prose.
secret_report_path = ".hexvision-conformance-gitleaks.json"
secret_report_rule_id_field = "RuleID"
secret_report_location_fields = ["File", "StartLine"]
secret_probe_seed = 127
secret_probe_prefix = "ghp_"
secret_probe_length = 36
probe_remote = "https://example.invalid/hexvision/conformance"
hook_installer_path = "scripts/install_hooks.sh"
hook_source_path = "scripts/pre_push_scan.sh"
hook_governed_target = "remotes"
probe_package_manager = "true"

